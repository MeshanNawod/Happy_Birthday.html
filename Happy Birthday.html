<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#120b2e;--ink:#fff6e8;--gold:#ffc83d;--coral:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.msg{position:fixed;left:0;right:0;top:12%;text-align:center;pointer-events:none;padding:0 20px}
h1{font-family:'Bagel Fat One',Impact,sans-serif;font-weight:400;margin:0;font-size:clamp(2.6rem,11vw,6rem);line-height:1;color:var(--gold);text-shadow:0 4px 0 var(--coral),0 10px 30px rgba(0,0,0,.5);animation:pop 1s cubic-bezier(.2,1.6,.4,1) both}
h2{font-family:'Bagel Fat One',Impact,sans-serif;font-weight:400;margin:.4em 0 0;font-size:clamp(1.8rem,8vw,3.6rem);animation:pop 1s .25s cubic-bezier(.2,1.6,.4,1) both}
p{margin:1em auto 0;max-width:26em;font-size:clamp(1rem,3.6vw,1.25rem);line-height:1.5;animation:pop 1s .5s both}
.hint{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:.95rem;opacity:.75;pointer-events:none}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){h1,h2,p{animation:none}}
</style>
</head>
<body>
<div class="msg">
  <h1>Happy Birthday!</h1>
  <h2 id="name">[Name]</h2>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var q=new URLSearchParams(location.search).get('name');
if(q)document.getElementById('name').textContent=q;
var cap=Math.min(window.devicePixelRatio||1,1.75),pr=cap,qf=1;
var r=new THREE.WebGLRenderer({antialias:(window.devicePixelRatio||1)<2,alpha:true,powerPreference:'high-performance'});
r.setPixelRatio(pr);r.setSize(innerWidth,innerHeight);
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFShadowMap;r.shadowMap.autoUpdate=false;
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.15;
document.body.appendChild(r.domElement);
var scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x120b2e,.02);
var cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
var cols=[0xff6b6b,0xffc83d,0x2ec4b6,0xb388ff,0xff9ff3,0x4dabf7],PAL=cols.map(function(c){return new THREE.Color(c)}),GOLD=new THREE.Color(0xffc83d),GREY=new THREE.Color(0x8a8a9a),WHITE=new THREE.Color(0xffffff);

scene.add(new THREE.HemisphereLight(0x9a8cff,0x2a1450,.75));
var sun=new THREE.DirectionalLight(0xfff0dd,.9);sun.position.set(5,10,7);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);var sc=sun.shadow.camera;sc.left=-7;sc.right=7;sc.top=7;sc.bottom=-7;sc.far=30;scene.add(sun);
var rim=new THREE.PointLight(0xff6b9d,.9,40);rim.position.set(-8,3,-6);scene.add(rim);

var GT=(function(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');
var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
function M(c,ro,me){return new THREE.MeshStandardMaterial({color:c,roughness:ro==null?.5:ro,metalness:me||0})}
var D=new THREE.Object3D(),TM=new THREE.Matrix4();

// stars
var sp=new Float32Array(700*3);for(var i=0;i<700;i++){var rr=70+Math.random()*50,a=Math.random()*6.283,b=Math.random()*1.3;
sp[i*3]=rr*Math.cos(a)*Math.cos(b);sp[i*3+1]=rr*Math.sin(b)+6;sp[i*3+2]=-Math.abs(rr*Math.sin(a)*Math.cos(b))-15}
var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
var stars=new THREE.Points(sg,new THREE.PointsMaterial({size:1.4,map:GT,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));stars.frustumCulled=false;scene.add(stars);

// floor
var fc=document.createElement('canvas');fc.width=fc.height=256;var fx=fc.getContext('2d');
var fg=fx.createRadialGradient(128,128,0,128,128,128);fg.addColorStop(0,'#6a35a0');fg.addColorStop(.55,'#27134f');fg.addColorStop(1,'#120b2e');fx.fillStyle=fg;fx.fillRect(0,0,256,256);
var floor=new THREE.Mesh(new THREE.CircleGeometry(16,48),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(fc),roughness:.35,metalness:.3}));
floor.rotation.x=-Math.PI/2;floor.position.y=-3.7;floor.receiveShadow=true;scene.add(floor);

// light beams
var bg=new THREE.ConeGeometry(3,24,20,1,true);bg.translate(0,-12,0);
var beams=[0xff6b9d,0x4dabf7].map(function(c,i){var m=new THREE.Mesh(bg,new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.07,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
 m.position.set(i?9:-9,11,-9);m.userData.b=i?-.38:.38;scene.add(m);return m});

// cake
var cake=new THREE.Group();cake.position.y=-3.65;cake.scale.setScalar(.95);scene.add(cake);
function cyl(rt,h,y,m){var o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rt,h,48),m);o.position.y=y;o.castShadow=o.receiveShadow=true;cake.add(o)}
cyl(3.2,.2,.1,M(0xffc83d,.25,.8));cyl(2.6,1.4,.9,M(0xffb3c6,.55));cyl(1.8,1.2,2.2,M(0xfff1dc,.55));
function im(geo,mat,n){var o=new THREE.InstancedMesh(geo,mat,n);o.frustumCulled=false;cake.add(o);return o}
var pink=M(0xff4f8b,.35);
var tg=new THREE.TorusGeometry(1,.15,12,64);
[[2.6,1.6],[1.8,2.8]].forEach(function(t){var tr=new THREE.Mesh(tg,pink);tr.scale.set(t[0],t[0],1);tr.rotation.x=Math.PI/2;tr.position.y=t[1];cake.add(tr)});
var drips=im(new THREE.SphereGeometry(.16,10,10),pink,31),di=0;
[[2.6,1.6],[1.8,2.8]].forEach(function(t){var n=Math.round(t[0]*7);for(var i=0;i<n;i++){var a=i/n*6.283,h=.25+Math.random()*.5;
 D.position.set(Math.cos(a)*t[0],t[1]-h*.5,Math.sin(a)*t[0]);D.rotation.set(0,0,0);D.scale.set(1,h*3,1);D.updateMatrix();drips.setMatrixAt(di++,D.matrix)}});
var pearls=im(new THREE.SphereGeometry(.14,12,12),M(0xffffff,.15,.4),28);
for(var i=0;i<28;i++){var a=i/28*6.283;D.position.set(Math.cos(a)*2.7,.35,Math.sin(a)*2.7);D.rotation.set(0,0,0);D.scale.set(1,1,1);D.updateMatrix();pearls.setMatrixAt(i,D.matrix)}
var spr=im(new THREE.CylinderGeometry(.03,.03,.18,5),new THREE.MeshStandardMaterial({roughness:.4}),60);
for(var i=0;i<60;i++){var a=Math.random()*6.283,rd=Math.sqrt(Math.random())*1.6;D.position.set(Math.cos(a)*rd,2.82,Math.sin(a)*rd);D.rotation.set(Math.PI/2,0,Math.random()*3);D.scale.set(1,1,1);D.updateMatrix();spr.setMatrixAt(i,D.matrix);spr.setColorAt(i,PAL[i%6])}
var chg=new THREE.SphereGeometry(.2,14,14),chm=M(0xc1121f,.15,.2);
for(var i=0;i<6;i++){var a=i/6*6.283,c=new THREE.Mesh(chg,chm);c.position.set(Math.cos(a)*1.45,3,Math.sin(a)*1.45);cake.add(c)}
var flames=[],glows=[],lit=true,cg=new THREE.CylinderGeometry(.08,.08,.9,10),fgm=new THREE.SphereGeometry(.11,10,10),fm=new THREE.MeshBasicMaterial({color:0xffe08a});
for(var i=0;i<5;i++){var a=i/5*6.283,x=Math.cos(a)*.75,z=Math.sin(a)*.75;
 var cd=new THREE.Mesh(cg,M(cols[i],.4));cd.position.set(x,3.25,z);cd.castShadow=true;cake.add(cd);
 var fl=new THREE.Mesh(fgm,fm);fl.position.set(x,3.85,z);fl.scale.y=1.9;cake.add(fl);flames.push(fl);
 var gl=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:0xffa640,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));gl.scale.set(1.3,1.3,1);gl.position.set(x,3.9,z);cake.add(gl);glows.push(gl)}
var fire=new THREE.PointLight(0xffa640,2,10);fire.position.set(0,4.4,0);cake.add(fire);

// gifts
var rib=M(0xffc83d,.3,.6),bx=new THREE.BoxGeometry(1,1,1);
[[-4.3,1.6,1.5,0xb388ff,.4],[4.5,.9,1.7,0x2ec4b6,-.3],[3.2,3.2,1.2,0xff6b6b,.7]].forEach(function(g){
 var o=new THREE.Group(),w=g[2];
 var b=new THREE.Mesh(bx,M(g[3],.4));b.scale.set(w,w*.8,w);b.position.y=w*.4;b.castShadow=true;o.add(b);
 var r1=new THREE.Mesh(bx,rib);r1.scale.set(w*.16,w*.82,w*1.02);r1.position.y=w*.4;o.add(r1);
 var r2=new THREE.Mesh(bx,rib);r2.scale.set(w*1.02,w*.82,w*.16);r2.position.y=w*.4;o.add(r2);
 var bw=new THREE.Mesh(new THREE.TorusKnotGeometry(w*.12,w*.04,32,6),rib);bw.position.y=w*.9;o.add(bw);
 o.position.set(g[0],-3.7,g[1]);o.rotation.y=g[4];scene.add(o)});

// orbiting stars
var NS=24,orb=new THREE.InstancedMesh(new THREE.OctahedronGeometry(.11),new THREE.MeshBasicMaterial({color:0xffc83d,fog:false}),NS);orb.frustumCulled=false;scene.add(orb);

// balloons (instanced)
var BN=16,bodyIM=new THREE.InstancedMesh(new THREE.SphereGeometry(1,24,24),M(0xffffff,.2,.08),BN),
knotIM=new THREE.InstancedMesh(new THREE.ConeGeometry(.16,.28,10),M(0xffffff,.3),BN),
strIM=new THREE.InstancedMesh(new THREE.CylinderGeometry(.012,.012,2.2,4),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.45}),BN);
[bodyIM,knotIM,strIM].forEach(function(o){o.frustumCulled=false;scene.add(o)});
var Lb=new THREE.Matrix4().makeScale(1,1.2,1),Lk=new THREE.Matrix4().makeTranslation(0,-1.38,0).multiply(new THREE.Matrix4().makeRotationX(Math.PI)),Ls=new THREE.Matrix4().makeTranslation(0,-2.55,0);
var bx_=[],by=[],bz=[],bs=[],bsp=[],bph=[],bry=[],bci=[];
function place(i,fresh){var side=Math.random()<.5?-1:1;bx_[i]=side*(4+Math.random()*9);by[i]=fresh?(Math.random()-.3)*14:-10;bz[i]=-3-Math.random()*9;bs[i]=.6+Math.random()*.6;bsp[i]=.4+Math.random()*.6;bph[i]=Math.random()*6.28;bci[i]=(Math.random()*6)|0;bry[i]=Math.random()*6;
 bodyIM.setColorAt(i,PAL[bci[i]]);knotIM.setColorAt(i,PAL[bci[i]]);bodyIM.instanceColor.needsUpdate=true;knotIM.instanceColor.needsUpdate=true}
for(var i=0;i<BN;i++)place(i,true);
var B=new THREE.Matrix4(),P=new THREE.Vector3(),Qt=new THREE.Quaternion(),E=new THREE.Euler(),S=new THREE.Vector3();

// particles
var N=2000,pos=new Float32Array(N*3),vel=new Float32Array(N*3),col=new Float32Array(N*3),base=new Float32Array(N*3),life=new Float32Array(N),mx=new Float32Array(N),grav=new Float32Array(N),ci=0;
for(var i=0;i<N;i++)pos[i*3+1]=-999;
var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));pg.setAttribute('color',new THREE.BufferAttribute(col,3));
var pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.32,map:GT,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));pts.frustumCulled=false;scene.add(pts);
function emit(x,y,z,c,n,spd,g,l,mix){n=Math.round(n*qf);
 for(var i=0;i<n;i++){var j=ci++%N,u=Math.random()*2-1,th=Math.random()*6.283,s=Math.sqrt(1-u*u),m=spd*(.4+Math.random()*.6),t=(mix&&Math.random()<.5)?PAL[(Math.random()*6)|0]:c;
  pos[j*3]=x;pos[j*3+1]=y;pos[j*3+2]=z;vel[j*3]=s*Math.cos(th)*m;vel[j*3+1]=u*m;vel[j*3+2]=s*Math.sin(th)*m;
  base[j*3]=t.r;base[j*3+1]=t.g;base[j*3+2]=t.b;life[j]=mx[j]=l*(.7+Math.random()*.5);grav[j]=g}}
function firework(){emit((Math.random()-.5)*20,4+Math.random()*7,-6-Math.random()*6,PAL[(Math.random()*6)|0],100,6,2.5,2.2,false)}
setTimeout(function(){emit(0,1,0,GOLD,240,8,7,2.8,true)},2600);
var fwT=3;

// input
var ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),tx=0,ty=0,sx=0,sy=0,V=new THREE.Vector3();
addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});
addEventListener('pointerdown',function(e){
 mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,cam);
 var hb=ray.intersectObject(bodyIM)[0],hc=ray.intersectObject(cake,true)[0];
 if(hb&&(!hc||hb.distance<hc.distance)){var i=hb.instanceId;emit(bx_[i],by[i],bz[i],PAL[bci[i]],90,6,6,2,true);place(i,false)}
 else if(hc){lit=!lit;flames.forEach(function(f){f.visible=lit});glows.forEach(function(g){g.visible=lit});
  if(lit)emit(0,1,0,GOLD,150,7,5,2.4,true);
  else for(var k=0;k<5;k++){var a=k/5*6.283;cake.updateMatrixWorld();V.set(Math.cos(a)*.75,3.9,Math.sin(a)*.75);cake.localToWorld(V);emit(V.x,V.y,V.z,GREY,12,.6,-1.5,2.2,false)}}
 else emit(mouse.x*8,mouse.y*5,0,WHITE,50,5,5,1.6,true)});
addEventListener('resize',function(){cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});

// loop
var clock=new THREE.Clock(),fr=0,fT=0,fN=0,good=0;
(function loop(){requestAnimationFrame(loop);
 var d=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;fr++;
 fT+=d;fN++;
 if(fT>=1&&t>4){var fps=fN/fT;fT=0;fN=0;
  if(fps<42&&pr>.8){pr=Math.max(.8,pr-.2);r.setPixelRatio(pr);qf=Math.max(.5,qf-.15);good=0}
  else if(fps>56){good++;if(good>=6&&pr<cap){pr=Math.min(cap,pr+.15);r.setPixelRatio(pr);qf=Math.min(1,qf+.1);good=0}}else good=0}
 var k=Math.min(t/3.6,1),e=1-Math.pow(1-k,3),sm=1-Math.pow(.02,d);
 sx+=(tx-sx)*sm;sy+=(ty-sy)*sm;
 cam.position.set(0+(sx*1.8)*e,9+(-sy*1.2-9)*e,30+(13.5-30)*e);cam.lookAt(0,-.8,0);
 cake.rotation.y+=d*.35;cake.position.y=-3.65+Math.sin(t*1.5)*.04;
 stars.rotation.y=t*.008;
 beams.forEach(function(m,i){m.rotation.z=m.userData.b+Math.sin(t*.5+i*2)*.15});
 if(lit){for(var i=0;i<5;i++){flames[i].scale.set(1+Math.sin(t*14+i*2)*.15,1.9+Math.sin(t*11+i)*.3,1);var g=1.2+Math.sin(t*9+i)*.15;glows[i].scale.set(g,g,1)}fire.intensity=1.9+Math.sin(t*13)*.3}else fire.intensity=0;
 for(var i=0;i<NS;i++){var a=t*.5+i/NS*6.283;D.position.set(Math.cos(a)*5,-1.5+Math.sin(t*.8+i)*1.2+(i%3)*.7,Math.sin(a)*5-1);D.rotation.set(t*2+i,t*1.5,0);D.scale.setScalar(.7+Math.sin(t*3+i)*.3);D.updateMatrix();orb.setMatrixAt(i,D.matrix)}
 orb.instanceMatrix.needsUpdate=true;
 for(var i=0;i<BN;i++){by[i]+=bsp[i]*d;bx_[i]+=Math.sin(t+bph[i])*.3*d;bry[i]+=d*.6;if(by[i]>12)place(i,false);
  P.set(bx_[i],by[i],bz[i]);Qt.setFromEuler(E.set(0,bry[i],Math.sin(t*1.2+bph[i])*.12));S.setScalar(bs[i]);B.compose(P,Qt,S);
  TM.multiplyMatrices(B,Lb);bodyIM.setMatrixAt(i,TM);TM.multiplyMatrices(B,Lk);knotIM.setMatrixAt(i,TM);TM.multiplyMatrices(B,Ls);strIM.setMatrixAt(i,TM)}
 bodyIM.instanceMatrix.needsUpdate=knotIM.instanceMatrix.needsUpdate=strIM.instanceMatrix.needsUpdate=true;
 fwT-=d;if(fwT<0&&t>3){firework();fwT=1.6+Math.random()*1.5}
 var dr=Math.pow(.35,d);
 for(var i=0;i<N;i++){if(life[i]>0){life[i]-=d;var i3=i*3;vel[i3]*=dr;vel[i3+2]*=dr;vel[i3+1]=vel[i3+1]*dr-grav[i]*d;
  pos[i3]+=vel[i3]*d;pos[i3+1]+=vel[i3+1]*d;pos[i3+2]+=vel[i3+2]*d;
  var f=life[i]>0?life[i]/mx[i]:0;col[i3]=base[i3]*f;col[i3+1]=base[i3+1]*f;col[i3+2]=base[i3+2]*f;if(f===0)pos[i3+1]=-999}}
 pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;
 if(fr%4===0)r.shadowMap.needsUpdate=true;
 r.render(scene,cam)})();
})();
</script>
</body>
</html>
